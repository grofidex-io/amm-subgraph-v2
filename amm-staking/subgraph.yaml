specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: AMMStake
    network: testnet
    source:
      address: "0xC1B294E3F0185A756c2d58463F42AE0882fEdCb6"
      abi: AMMStake
      startBlock: 48133527
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - AddPool
        - Deposit
        - Withdraw
        - SetPool
      abis:
        - name: AMMStake
          file: ./abis/AMMStake.json
      eventHandlers:
        - event: AddPool(indexed uint256,indexed address,indexed uint256,uint32,uint32)
          handler: handleAddPool
        - event: Deposit(indexed address,indexed uint256,indexed uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,address,indexed uint256,indexed uint256)
          handler: handleWithdraw
        - event: SetPool(indexed uint256,indexed uint256,uint32,uint32)
          handler: handleSetPool
      file: ./src/mapping.ts
